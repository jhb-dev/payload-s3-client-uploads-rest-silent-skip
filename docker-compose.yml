version: '3'

services:
  # MongoDB for Payload
  mongo:
    image: mongo:latest
    ports:
      - '27017:27017'
    command:
      - --storageEngine=wiredTiger
    volumes:
      - data:/data/db
    logging:
      driver: none

  # Minio is an S3-compatible bucket — used as the storage-s3 target.
  minio:
    image: minio/minio:latest
    ports:
      - '9100:9000'
    environment:
      MINIO_ROOT_USER: test
      MINIO_ROOT_PASSWORD: testtest123
    command: server /data
    volumes:
      - minio-data:/data

  # Creates the bucket on minio startup so the reproduction has a place
  # to (not) upload to.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      sh -c "
      until /usr/bin/mc alias set local http://minio:9000 test testtest123; do sleep 1; done;
      /usr/bin/mc mb --ignore-existing local/payload-repro-bucket;
      exit 0;
      "

volumes:
  data:
  minio-data:
